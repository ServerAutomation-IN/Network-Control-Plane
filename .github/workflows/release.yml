name: Release & Package Network Control Plane

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0-GA)'
        required: true
        default: 'v1.0.0-GA'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Run Pytest & Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies and test
        run: |
          pip install uv
          cd backend
          uv pip install --system -e ".[dev]"
          pytest -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies and build
        run: |
          cd frontend
          npm ci
          npm run build

  build-artifacts:
    name: Build & Package Release Artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Backend Wheel and Source Distribution
        run: |
          pip install build
          cd backend
          python -m build --outdir ../dist/backend

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Distribution
        run: |
          cd frontend
          npm ci
          npm run build
          mkdir -p ../dist/frontend
          tar -czf ../dist/frontend/network-control-plane-frontend-v1.0.0.tar.gz -C dist .

      - name: Generate Checksums
        run: |
          cd dist
          find . -type f -exec sha256sum {} + > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Network Control Plane ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            dist/backend/*
            dist/frontend/*
            dist/SHA256SUMS.txt
